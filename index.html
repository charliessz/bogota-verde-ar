<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bogotá Verde AR - MVP</title>

  <!-- A-Frame y MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f5f5f5;
    }

    /* Asegura que A-Frame/MindAR ocupen toda la pantalla */
    a-scene {
      position: fixed;
      inset: 0;
    }

    /* Contenedor del menú superior */
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: none;              /* ANTES: display: flex; */
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      background: #0b1720;
      z-index: 10;
    }

    #menu button {
      flex: 1 1 auto;
      min-width: 90px;
      padding: 6px 8px;
      border: none;
      border-radius: 999px;
      background: #1b5e20;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    #menu button:hover {
      background: #2e7d32;
      transform: translateY(-1px);
    }

    #menu button:active {
      transform: translateY(1px);
      background: #255d27;
    }

    /* Panel de información */
    #info-panel {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      color: #f5f5f5;
      font-size: 0.8rem;
      line-height: 1.4;
      z-index: 10;
      display: none;              /* ANTES: sin display (visible) */
     }

    #info-title {
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    #quiz-options {
      margin-top: 6px;
      display: none;
      gap: 4px;
      flex-wrap: wrap;
    }

    #quiz-options button {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #1b5e20;
      background: #0c1a0e;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
    }

    #quiz-feedback {
      margin-top: 4px;
      font-size: 0.75rem;
    }

    /* Aviso para rotar el dispositivo si se quiere */
    #hint {
      position: fixed;
      right: 8px;
      bottom: 8px;
      font-size: 0.7rem;
      opacity: 0.8;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Menú interactivo -->
  <div id="menu">
    <button data-park="simon">Simón Bolívar</button>
    <button data-park="nacional">Parque Nacional</button>
    <button data-park="tunal">Parque El Tunal</button>
    <button data-section="info">Información</button>
    <button data-section="historia">Historia</button>
    <button data-section="cuidado">Cuidado ambiental</button>
    <button data-section="normas">Normas</button>
    <button data-section="seguridad">Seguridad</button>
    <button data-section="quiz">Quiz</button>
  </div>

  <!-- Botón temporal para pruebas de modelo -->
  <button
    id="boton-test-simon"
    onclick="document.getElementById('parque-simon').setAttribute('visible', true)"
    style="position:fixed; bottom:80px; left:10px; z-index:999; padding:10px 12px; background:#d32f2f; color:#fff; border:none; border-radius:8px; font-size:0.8rem;">
    TEST: Mostrar Simón
  </button>

  <!-- Panel de información dinámico -->
  <div id="info-panel">
    <div id="info-title">Bogotá Verde AR</div>
    <div id="info-body">
      Apunta la cámara hacia el marcador impreso para ver el parque en realidad aumentada.
    </div>

    <!-- Sección de quiz (oculta hasta seleccionar Quiz) -->
    <div id="quiz-options">
      <button data-answer="a">a) Botar residuos en cualquier parte</button>
      <button data-answer="b">b) Separar residuos y usar canecas</button>
      <button data-answer="c">c) Alimentar a todos los animales</button>
    </div>
    <div id="quiz-feedback"></div>
  </div>

  <div id="hint">Gira el dispositivo y aléjate/un poco del marcador para ver mejor la escena.</div>

  <!-- Escena AR con MindAR + A-Frame -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning:no; uiLoading:no; uiError:no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="10000">
      <a-asset-item id="modelo-simon" src="./assets/modelos/parque-simon.glb"></a-asset-item>
      <a-asset-item id="modelo-nacional" src="./assets/modelos/parque-nacional.glb"></a-asset-item>
      <a-asset-item id="modelo-tunal" src="./assets/modelos/parque-tunal.glb"></a-asset-item>
    </a-assets>

    <!-- Cámara AR -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Luz ambiental y direccional para el parque -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="0 1 1"></a-entity>

    <!-- Contenido anclado al marcador (targetIndex: 0) -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">

      <!-- Parque Simón Bolívar -->
      <a-entity id="parque-simon" visible="false">
        <a-entity
          id="modelo-simon-entity"
          gltf-model="#modelo-simon"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.05 0.05 0.05"
        ></a-entity>
      </a-entity>

      <!-- Parque Nacional -->
      <a-entity id="parque-nacional" visible="false">
        <a-entity
          id="modelo-nacional-entity"
          gltf-model="#modelo-nacional"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.05 0.05 0.05"
        ></a-entity>
      </a-entity>

      <!-- Parque El Tunal -->
      <a-entity id="parque-tunal" visible="false">
        <a-entity
          id="modelo-tunal-entity"
          gltf-model="#modelo-tunal"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.05 0.05 0.05"
        ></a-entity>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const infoTitle = document.getElementById("info-title");
    const infoBody = document.getElementById("info-body");
    const quizOptions = document.getElementById("quiz-options");
    const quizFeedback = document.getElementById("quiz-feedback");

    const parks = {
      simon: document.getElementById("parque-simon"),
      nacional: document.getElementById("parque-nacional"),
      tunal: document.getElementById("parque-tunal")
    };

    const parkInfo = {
      simon: {
        title: "Parque Simón Bolívar",
        body: "Uno de los parques más representativos de Bogotá. Es reconocido por sus zonas verdes, lago, espacios para recreación y grandes eventos."
      },
      nacional: {
        title: "Parque Nacional",
        body: "Espacio tradicional de la ciudad, con valor histórico, cultural y ambiental. Es ideal para caminar, descansar y encontrarse con la naturaleza."
      },
      tunal: {
        title: "Parque El Tunal",
        body: "Parque urbano importante del sur de Bogotá, con áreas para deporte, recreación y actividades en familia."
      }
    };

    const sections = {
      info: {
        title: "Información del lugar",
        body: "Selecciona un parque desde el menú para visualizarlo en realidad aumentada."
      },
      historia: {
        title: "Historia y cultura ciudadana",
        body: "Los parques de Bogotá son espacios clave para la cultura, los conciertos, ferias y encuentros ciudadanos. Promueven el respeto y la convivencia."
      },
      cuidado: {
        title: "Cuidado ambiental",
        body: "Usa las canecas de colores para separar residuos, cuida el césped y los árboles, respeta la fauna urbana y evita generar ruido excesivo."
      },
      normas: {
        title: "Normas de uso del espacio público",
        body: "Respeta las zonas peatonales, no dañes el mobiliario, controla tus mascotas, usa las ciclorrutas correctamente y evita actividades que deterioren el parque."
      },
      seguridad: {
        title: "Recomendaciones de seguridad",
        body: "Cuida tus objetos personales, no permanezcas en zonas solas en la noche, sigue la señalización e identifica puntos de encuentro con tus acompañantes."
      },
      quiz: {
        title: "Quiz: cuidado del parque",
        body: "¿Cuál de estas acciones es la más adecuada para cuidar el parque?"
      }
    };

    function hideAllParks() {
      Object.values(parks).forEach((park) => {
        park.setAttribute("visible", "false");
      });
    }

    function showPark(parkKey) {
      hideAllParks();
      parks[parkKey].setAttribute("visible", "true");
      infoTitle.textContent = parkInfo[parkKey].title;
      infoBody.textContent = parkInfo[parkKey].body;
      quizOptions.style.display = "none";
      quizFeedback.textContent = "";
    }

    document.querySelectorAll("#menu button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const park = btn.getAttribute("data-park");
        const section = btn.getAttribute("data-section");

        if (park) {
          showPark(park);
          return;
        }

        if (section) {
          const data = sections[section];
          infoTitle.textContent = data.title;
          infoBody.textContent = data.body;

          if (section === "quiz") {
            quizOptions.style.display = "flex";
            quizFeedback.textContent = "";
          } else {
            quizOptions.style.display = "none";
            quizFeedback.textContent = "";
          }
        }
      });
    });

    quizOptions.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const answer = btn.getAttribute("data-answer");
        if (answer === "b") {
          quizFeedback.textContent = "✅ Correcto: separar residuos y usar canecas ayuda a cuidar el parque.";
          quizFeedback.style.color = "#81c784";
        } else {
          quizFeedback.textContent = "❌ Revisa de nuevo. Piensa en cómo tus acciones impactan el medio ambiente.";
          quizFeedback.style.color = "#ef9a9a";
        }
      });
    });

    document.addEventListener("DOMContentLoaded", function () {
      const target = document.getElementById("ar-target");
      const menuEl = document.getElementById("menu");
      const infoPanelEl = document.getElementById("info-panel");

      if (!target) return;

      target.addEventListener("targetFound", () => {
        menuEl.style.display = "flex";
        infoPanelEl.style.display = "block";
        infoTitle.textContent = "Bogotá Verde AR";
        infoBody.textContent = "Selecciona un parque desde el menú para visualizarlo en realidad aumentada.";
        hideAllParks();
      });

      target.addEventListener("targetLost", () => {
        menuEl.style.display = "none";
        infoPanelEl.style.display = "none";
        hideAllParks();
      });
    });
  </script>
</body>
</html>
