<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bogotá Verde AR - MVP</title>

  <!-- A-Frame y MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1720;
      color: #f5f5f5;
    }

    /* Contenedor del menú superior */
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: none;              /* ANTES: display: flex; */
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      background: #0b1720;
      z-index: 10;
    }

    #menu button {
      flex: 1 1 auto;
      min-width: 90px;
      padding: 6px 8px;
      border: none;
      border-radius: 999px;
      background: #1b5e20;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    #menu button:hover {
      background: #2e7d32;
      transform: translateY(-1px);
    }

    #menu button:active {
      transform: translateY(1px);
      background: #255d27;
    }

    /* Panel de información */
    #info-panel {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      color: #f5f5f5;
      font-size: 0.8rem;
      line-height: 1.4;
      z-index: 10;
      display: none;              /* ANTES: sin display (visible) */
     }

    #info-title {
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    #quiz-options {
      margin-top: 6px;
      display: none;
      gap: 4px;
      flex-wrap: wrap;
    }

    #quiz-options button {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #1b5e20;
      background: #0c1a0e;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
    }

    #quiz-feedback {
      margin-top: 4px;
      font-size: 0.75rem;
    }

    /* Aviso para rotar el dispositivo si se quiere */
    #hint {
      position: fixed;
      right: 8px;
      bottom: 8px;
      font-size: 0.7rem;
      opacity: 0.8;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Menú interactivo -->
  <div id="menu">
    <button data-section="mapa">Mapa</button>
    <button data-section="info">Información</button>
    <button data-section="historia">Historia</button>
    <button data-section="cuidado">Cuidado ambiental</button>
    <button data-section="normas">Normas</button>
    <button data-section="seguridad">Seguridad</button>
    <button data-section="quiz">Quiz</button>
  </div>

  <!-- Panel de información dinámico -->
  <div id="info-panel">
    <div id="info-title">Bogotá Verde AR</div>
    <div id="info-body">
      Apunta la cámara hacia el marcador impreso para ver el parque en realidad aumentada.
    </div>

    <!-- Sección de quiz (oculta hasta seleccionar Quiz) -->
    <div id="quiz-options">
      <button data-answer="a">a) Botar residuos en cualquier parte</button>
      <button data-answer="b">b) Separar residuos y usar canecas</button>
      <button data-answer="c">c) Alimentar a todos los animales</button>
    </div>
    <div id="quiz-feedback"></div>
  </div>

  <div id="hint">Gira el dispositivo y aléjate/un poco del marcador para ver mejor la escena.</div>

  <!-- Escena AR con MindAR + A-Frame -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <!-- Cámara AR -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Luz ambiental y direccional para el parque -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="0 1 1"></a-entity>

    <!-- Contenido anclado al marcador (targetIndex: 0) -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <!-- Suelo del parque -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="1.2"
        height="1.2"
        color="#4caf50"
      ></a-plane>

      <!-- Camineras -->
      <a-box
        position="0 0.01 0"
        width="0.2"
        height="0.01"
        depth="1.2"
        color="#c8c8c8"
      ></a-box>

      <!-- Árboles (cilindro + esfera) -->
      <a-cylinder position="-0.4 0.15 -0.2" radius="0.03" height="0.3" color="#8d6e63"></a-cylinder>
      <a-sphere position="-0.4 0.35 -0.2" radius="0.12" color="#2e7d32"></a-sphere>

      <a-cylinder position="0.4 0.15 0.3" radius="0.03" height="0.3" color="#8d6e63"></a-cylinder>
      <a-sphere position="0.4 0.35 0.3" radius="0.12" color="#2e7d32"></a-sphere>

      <!-- Bancas -->
      <a-box position="-0.2 0.05 0.3" width="0.25" height="0.05" depth="0.1" color="#5d4037"></a-box>
      <a-box position="-0.2 0.09 0.3" width="0.25" height="0.02" depth="0.1" color="#795548"></a-box>

      <a-box position="0.2 0.05 -0.3" width="0.25" height="0.05" depth="0.1" color="#5d4037"></a-box>
      <a-box position="0.2 0.09 -0.3" width="0.25" height="0.02" depth="0.1" color="#795548"></a-box>

      <!-- Canecas -->
      <a-cylinder position="0 0.08 -0.4" radius="0.04" height="0.16" color="#1565c0"></a-cylinder>
      <a-cylinder position="0.1 0.08 -0.4" radius="0.04" height="0.16" color="#f9a825"></a-cylinder>
      <a-cylinder position="-0.1 0.08 -0.4" radius="0.04" height="0.16" color="#c62828"></a-cylinder>

      <!-- Señal informativa "Parque Bogotá Verde" -->
      <a-box position="0 0.18 0.4" width="0.35" height="0.18" depth="0.02" color="#263238"></a-box>
      <a-text
        value="Parque Bogotá Verde"
        position="-0.16 0.22 0.39"
        width="0.7"
        color="#ffffff"
      ></a-text>

      <!-- Ícono flotante (información) -->
      <a-sphere
        id="icono-info"
        position="0 0.4 0"
        radius="0.05"
        color="#ffca28"
        animation="property: position; to: 0 0.45 0; dir: alternate; loop: true; dur: 1000"
      ></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    // Contenido de cada sección del menú
    const sections = {
      mapa: {
        title: "Mapa de parques",
        body:
          "Explora parques como el Simón Bolívar, Parque Nacional y Tunal. Este prototipo representa un parque genérico de Bogotá."
      },
      info: {
        title: "Información del lugar",
        body:
          "Nombre: Parque Bogotá Verde (prototipo). Aquí puedes caminar, hacer deporte, compartir en familia y conectarte con la naturaleza."
      },
      historia: {
        title: "Historia y cultura ciudadana",
        body:
          "Los parques de Bogotá son espacios clave para la cultura, los conciertos, ferias y encuentros ciudadanos. Promueven el respeto y la convivencia."
      },
      cuidado: {
        title: "Cuidado ambiental",
        body:
          "Usa las canecas de colores para separar residuos, cuida el césped y los árboles, respeta la fauna urbana y evita generar ruido excesivo."
      },
      normas: {
        title: "Normas de uso del espacio público",
        body:
          "Respeta las zonas peatonales, no dañes el mobiliario, controla tus mascotas, usa las ciclorrutas correctamente y evita actividades que deterioren el parque."
      },
      seguridad: {
        title: "Recomendaciones de seguridad",
        body:
          "Cuida tus objetos personales, no permanezcas en zonas solas en la noche, sigue la señalización e identifica puntos de encuentro con tus acompañantes."
      },
      quiz: {
        title: "Quiz: cuidado del parque",
        body:
          "¿Cuál de estas acciones es la más adecuada para cuidar el parque?"
      }
    };

    const infoTitle = document.getElementById("info-title");
    const infoBody = document.getElementById("info-body");
    const quizOptions = document.getElementById("quiz-options");
    const quizFeedback = document.getElementById("quiz-feedback");

    // Manejo de clic en botones del menú
    document.querySelectorAll("#menu button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const section = btn.getAttribute("data-section");
        const data = sections[section];

        infoTitle.textContent = data.title;
        infoBody.textContent = data.body;

        if (section === "quiz") {
          quizOptions.style.display = "flex";
          quizFeedback.textContent = "";
        } else {
          quizOptions.style.display = "none";
          quizFeedback.textContent = "";
        }
      });
    });

    // Manejo de respuestas del quiz
    quizOptions.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const answer = btn.getAttribute("data-answer");
        if (answer === "b") {
          quizFeedback.textContent =
            "✅ Correcto: separar residuos y usar canecas ayuda a cuidar el parque.";
          quizFeedback.style.color = "#81c784";
        } else {
          quizFeedback.textContent =
            "❌ Revisa de nuevo. Piensa en cómo tus acciones impactan el medio ambiente.";
          quizFeedback.style.color = "#ef9a9a";
        }
      });
    });
    document.addEventListener("DOMContentLoaded", () => {
    const target = document.getElementById("ar-target");
    const menuEl = document.getElementById("menu");
    const infoPanelEl = document.getElementById("info-panel");

    if (!target) return;

    // Cuando el marcador se detecta
    target.addEventListener("targetFound", () => {
      console.log("Marcador detectado");
      menuEl.style.display = "flex";
      infoPanelEl.style.display = "block";
    });

    // Cuando el marcador se pierde
    target.addEventListener("targetLost", () => {
      console.log("Marcador perdido");
      menuEl.style.display = "none";
      infoPanelEl.style.display = "none";
    });
  });
  </script>
</body>
</html>
